# RUN: yaml2obj %s -o %t1.o

# RUN: wasm-ld --no-entry %t1.o -o - | obj2yaml | FileCheck %s --check-prefix NO-SHARED

# RUN: not wasm-ld --no-entry --shared-memory --max-memory=131072 %t1.o -o - 2>&1 | FileCheck %s --check-prefix SHARED

## A relocatable object must retain the memory constraint even when it is
## the only target feature.
# RUN: wasm-ld -r %t1.o -o %t.partial.o
# RUN: obj2yaml %t.partial.o | FileCheck %s --check-prefix MARKER
# RUN: wasm-ld -r --no-check-features --features=shared-mem %t1.o -o - | obj2yaml | FileCheck %s --check-prefix MARKER
# RUN: wasm-ld -r --strip-all %t1.o -o - | obj2yaml | FileCheck %s --check-prefix STRIPPED
# RUN: wasm-ld -r --strip-all --keep-section=target_features %t1.o -o - | obj2yaml | FileCheck %s --check-prefix MARKER

## Relink the partial object with another input and the features needed for
## shared memory. The next link must still see the constraint.
# RUN: yaml2obj %S/Inputs/use-feature-foo.yaml -o %t.foo.o
# RUN: wasm-ld -r --extra-features=simd128,bulk-memory,atomics %t.foo.o %t.partial.o -o %t.mixed.o
# RUN: obj2yaml %t.mixed.o | FileCheck %s --check-prefix MIXED
# RUN: wasm-ld --no-entry %t.mixed.o -o - | obj2yaml | FileCheck %s --check-prefix PRIVATE
# RUN: not wasm-ld --no-entry --shared-memory --max-memory=131072 %t.mixed.o -o %t.wasm 2>&1 | FileCheck %s --check-prefix PARTIAL-ERROR

--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            IMPORT
    Imports:
      - Module:          env
        Field:           __linear_memory
        Kind:            MEMORY
        Memory:
          Minimum:         0x00000001
      - Module:          env
        Field:           __indirect_function_table
        Kind:            TABLE
        Table:
          Index:           0
          ElemType:        FUNCREF
          Limits:
            Minimum:         0x00000000
  - Type:            DATA
    Segments:
      - SectionOffset:   6
        InitFlags:       0
        Offset:
          Opcode:          I32_CONST
          Value:           0
        Content:         68656C6C6F0A00
  - Type:            CUSTOM
    Name:            linking
    Version:         2
    SymbolTable:
      - Index:           0
        Kind:            DATA
        Name:            hello_str
        Flags:           [  ]
        Segment:         0
        Size:            7
    SegmentInfo:
      - Index:           0
        Name:            .rodata.hello_str
        Alignment:       0
        Flags:           [  ]
  - Type:            CUSTOM
    Name:            target_features
    Features:
      - Prefix:        DISALLOWED
        Name:          "shared-mem"
...

# NO-SHARED:      - Type:            MEMORY
# NO-SHARED-NEXT:   Memories:
# NO-SHARED-NEXT:     - Minimum:         0x1
# NO-SHARED-NOT:        Maximum:
# NO-SHARED-NOT:        target_features

# SHARED: --shared-memory is disallowed by {{.*}}shared-memory-no-atomics.yaml.tmp1.o because it was not compiled with 'atomics' or 'bulk-memory' features.

# MARKER:      Name: target_features
# MARKER-NEXT: Features:
# MARKER-NEXT:   - Prefix: DISALLOWED
# MARKER-NEXT:     Name: shared-mem
# MARKER-NEXT: ...

# STRIPPED-NOT: target_features

# MIXED:      Name: target_features
# MIXED-NEXT: Features:
# MIXED-NEXT:   - Prefix: USED
# MIXED-NEXT:     Name: atomics
# MIXED-NEXT:   - Prefix: USED
# MIXED-NEXT:     Name: bulk-memory
# MIXED-NEXT:   - Prefix: USED
# MIXED-NEXT:     Name: foo
# MIXED-NEXT:   - Prefix: DISALLOWED
# MIXED-NEXT:     Name: shared-mem
# MIXED-NEXT:   - Prefix: USED
# MIXED-NEXT:     Name: simd128
# MIXED-NEXT: ...

# PRIVATE:     Name: target_features
# PRIVATE-NOT: DISALLOWED
# PARTIAL-ERROR: --shared-memory is disallowed by {{.*}}.mixed.o
